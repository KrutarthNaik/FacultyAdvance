services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: facultyadvance
      POSTGRES_USER: facultyadvance
      POSTGRES_PASSWORD: local-dev-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facultyadvance -d facultyadvance"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      DEBUG: "True"
      SECRET_KEY: compose-local-development-only
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DATABASE_URL: postgresql://facultyadvance:local-dev-only@db:5432/facultyadvance
      FRONTEND_ORIGIN: http://localhost:8080
      CSRF_TRUSTED_ORIGINS: http://localhost:8080
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      PUBLIC_REGISTRATION_ENABLED: "True"
      PASSWORD_RESET_FRONTEND_URL: http://localhost:8080/reset-password
      EMAIL_VERIFICATION_FRONTEND_URL: http://localhost:8080/verify-email
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
