name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: facultyadvance
          POSTGRES_USER: facultyadvance
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U facultyadvance -d facultyadvance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DEBUG: "True"
      SECRET_KEY: ci-only-development-secret
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://facultyadvance:ci-only-password@localhost:5432/facultyadvance
      FRONTEND_ORIGIN: http://localhost:5173
      CSRF_TRUSTED_ORIGINS: http://localhost:5173
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test core
      - name: Check Vercel production configuration
        env:
          VERCEL: "1"
          DEBUG: "False"
          SECRET_KEY: ci-only-secret-key-that-is-at-least-fifty-characters-long
          ALLOWED_HOSTS: api.example.vercel.app
          VERCEL_URL: api.example.vercel.app
          DATABASE_URL: postgresql://facultyadvance:ci-only-password@localhost:5432/facultyadvance?sslmode=verify-full
          REDIS_URL: rediss://default:ci-only-password@localhost:6379/0
          FRONTEND_ORIGINS: https://faculty.example.vercel.app,https://faculty-preview.vercel.app
          CSRF_TRUSTED_ORIGINS: https://faculty.example.vercel.app,https://faculty-preview.vercel.app
          TRUST_PROXY_SSL_HEADER: "True"
          USE_S3_STORAGE: "True"
          AWS_STORAGE_BUCKET_NAME: facultyadvance-ci
          AWS_S3_REGION_NAME: us-east-1
          EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
          DEFAULT_FROM_EMAIL: no-reply@example.invalid
          PASSWORD_RESET_FRONTEND_URL: https://faculty.example.vercel.app/reset-password
          EMAIL_VERIFICATION_FRONTEND_URL: https://faculty.example.vercel.app/verify-email
          PUBLIC_REGISTRATION_ENABLED: "False"
          EVIDENCE_UPLOAD_MAX_BYTES: "4194304"
        run: python manage.py check --deploy

  frontend:
    runs-on: ubuntu-latest
    env:
      VERCEL: "1"
      VITE_API_URL: https://facultyadvance-api.example.invalid/api/
      VITE_EVIDENCE_UPLOAD_MAX_MB: "4"
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
